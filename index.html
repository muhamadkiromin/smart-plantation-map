<!DOCTYPE html>
<html>
<head>

<title>IPDS Smart Plantation Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:#eef5e8;
}


/* HEADER */

.header{

background:#075e2b;
color:white;
padding:20px;
font-size:26px;
font-weight:bold;

}


/* DASHBOARD */

.cards{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
padding:20px;

}


.card{

background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #ccc;

}


.title{
color:#555;
}


.number{

font-size:30px;
font-weight:bold;
color:#087f35;

}



/* MAP */

.container{

padding:20px;

}


.map{

position:relative;
background:white;
padding:20px;
border-radius:20px;

}


.map img{

width:100%;
border-radius:15px;

}



/* PIN */


.pin{

position:absolute;

width:45px;
height:45px;

border-radius:50%;

color:white;

font-weight:bold;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

border:3px solid white;

box-shadow:0 3px 8px #555;

}


.green{

background:#16a34a;

top:20%;

left:40%;

}



.yellow{

background:#eab308;

top:45%;

left:55%;

}



.red{

background:#dc2626;

top:35%;

left:70%;

}



/* DETAIL */

.detail{

margin:20px;

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px #ccc;

font-size:18px;

}


</style>


</head>


<body>


<div class="header">

🌴 IPDS SMART PLANTATION MAP

</div>



<div class="cards">


<div class="card">

<div class="title">
Total Area
</div>

<div class="number">
1,250 Ha
</div>

</div>



<div class="card">

<div class="title">
Total Blocks
</div>

<div class="number">
22
</div>

</div>



<div class="card">

<div class="title">
Workers
</div>

<div class="number">
35
</div>

</div>



<div class="card">

<div class="title">
Monthly Yield
</div>

<div class="number">
3.00 Tan / Hektar
</div>

</div>



</div>





<div class="container">


<h2>
🗺️ Plantation Monitoring Map
</h2>



<div class="map">


<img src="felda-tunggal-map-crop.png">



<!-- PIN -->

<div class="pin green"
onclick="show('1')">

1

</div>



<div class="pin yellow"
onclick="show('2')">

2

</div>



<div class="pin red"
onclick="show('3')">

3

</div>



</div>


</div>





<div class="detail" id="detail">


🌴 Klik pin pada peta untuk melihat maklumat lot


</div>






<script>


function show(block){



let data={



"1":{


owner:"Ahmad Bin Ali",

area:"35 Ha",

trees:"6,500 unit",

age:"8 Tahun",

yield:"120 Tan/Bulan",

score:"92%",

status:"🟢 Normal"


},




"2":{


owner:"Siti Mariam",

area:"40 Ha",

trees:"7,200 unit",

age:"10 Tahun",

yield:"135 Tan/Bulan",

score:"78%",

status:"🟡 Monitoring"


},





"3":{


owner:"Rahman Bin Hassan",

area:"32 Ha",

trees:"5,900 unit",

age:"7 Tahun",

yield:"98 Tan/Bulan",

score:"55%",

status:"🔴 Alert"


}



};




document.getElementById("detail").innerHTML=`

<h2>
🌴 Maklumat Lot ${block}
</h2>


👨‍🌾 <b>Pekebun:</b> 
${data[block].owner}

<br><br>


📏 <b>Keluasan:</b>
${data[block].area}


<br>


🌴 <b>Jumlah Pokok:</b>
${data[block].trees}


<br>


🌱 <b>Umur Pokok:</b>
${data[block].age}


<br>


📦 <b>Anggaran BTS:</b>
${data[block].yield}


<br>


🤖 <b>AI Health Score:</b>
${data[block].score}


<br>


Status:
${data[block].status}



`;



}



</script>



</body>

</html>
