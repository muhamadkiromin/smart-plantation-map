<!DOCTYPE html>
<html>
<head>
<title>IPDS Smart Plantation Map</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:#eef5e8;
}

.header{
background:#14532d;
color:white;
padding:20px;
font-size:25px;
font-weight:bold;
}

.container{
padding:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 3px 10px #aaa;
}

.number{
font-size:30px;
font-weight:bold;
color:#166534;
}

.map{
    height:600px;
    overflow:hidden;
    border-radius:20px;
}

.farm-map{
    width:100%;
    height:600px;
    object-fit:contain;
}

.lot-pin{
    position:absolute;
    width:42px;
    height:42px;
    border-radius:50%;
    border:3px solid white;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transform:translate(-50%,-50%);
    box-shadow:0 3px 10px rgba(0,0,0,0.4);
}

.lot-pin:hover{
    transform:translate(-50%,-50%) scale(1.15);
}

.healthy{
    background:#16a34a;
}

.monitoring{
    background:#eab308;
}

.alert{
    background:#dc2626;
}
    
.block{
background:#22c55e;
border-radius:15px;
padding:20px;
color:white;
text-align:center;
cursor:pointer;
font-weight:bold;
}

.block:hover{
background:#15803d;
}

.info{
margin-top:20px;
background:white;
padding:20px;
border-radius:15px;
}

</style>

</head>


<body>

<div class="header">
🌴 IPDS SMART PLANTATION MAP
</div>


<div class="container">


<div class="cards">

<div class="card">
Total Area
<div class="number">1,250 Ha</div>
</div>


<div class="card">
Total Blocks
<div class="number">45</div>
</div>


<div class="card">
Workers
<div class="number">120</div>
</div>


<div class="card">
Monthly Yield
<div class="number">1,240 Ton</div>
</div>


</div>



<h2>🗺 Plantation Monitoring Map</h2>


<div class="map">

    <div class="map-wrapper">

        <img src="felda-tunggal-map-crop.png"
        class="farm-map"
        alt="Peta Ladang FELDA Tunggal">

        <!-- LOT DEMO 1 -->
        <button class="lot-pin healthy"
        style="top:40%; left:53%;"
        onclick="showLot(
        'LOT 001',
        'ZAINY',
        'Healthy',
        '3.20 Ha',
        '485 Pokok',
        '9 Tahun',
        '5.8 Tan/Bulan',
        '92%'
        )">1</button>


        <!-- LOT DEMO 2 -->
        <button class="lot-pin monitoring"
        style="top:54%; left:44%;"
        onclick="showLot(
        'LOT 002',
        'REDZUAN',
        'Monitoring',
        '3.05 Ha',
        '462 Pokok',
        '11 Tahun',
        '4.9 Tan/Bulan',
        '76%'
        )">2</button>


        <!-- LOT DEMO 3 -->
        <button class="lot-pin alert"
        style="top:63%; left:59%;"
        onclick="showLot(
        'LOT 003',
        'MOHD RABIRAN',
        'Alert',
        '2.85 Ha',
        '430 Pokok',
        '12 Tahun',
        '3.7 Tan/Bulan',
        '58%'
        )">3</button>

    </div>

</div>


<div class="info" id="detail">

<h2>🌴 Maklumat Lot</h2>

Klik pin pada peta untuk melihat maklumat pekebun.

</div>


</div>

<script>

function showLot(
lot,
owner,
status,
area,
trees,
age,
yieldData,
healthScore
){

let statusIcon = "🟢";

if(status === "Monitoring"){
    statusIcon = "🟡";
}

if(status === "Alert"){
    statusIcon = "🔴";
}

document.getElementById("detail").innerHTML = `

<h2>🌴 ${lot}</h2>

<strong>👨‍🌾 Pekebun:</strong>
${owner}

<br><br>

<strong>Status Kesihatan:</strong>
${statusIcon} ${status}

<br><br>

<strong>📏 Keluasan:</strong>
${area}

<br>

<strong>🌴 Jumlah Pokok:</strong>
${trees}

<br>

<strong>📅 Umur Pokok:</strong>
${age}

<br>

<strong>📦 Anggaran Hasil BTS:</strong>
${yieldData}

<br>

<strong>🤖 AI Health Score:</strong>
${healthScore}

<br><br>

<small>
⚠️ Data keluasan, pokok, umur, hasil dan AI Health Score adalah data simulasi untuk tujuan demo.
</small>

`;

}

<script>

function show(block){

let data = {

<div class="pin green" onclick="show('1')">
1
</div>
pokok:"6,500 unit",
keluasan:"35 Ha",
umur:"8 Tahun",
pemeriksaan:"08/09/2026",
status:"🟢 Normal"
},

<div class="pin yellow" onclick="show('2')">
2
</div>
pokok:"7,200 unit",
keluasan:"40 Ha",
umur:"10 Tahun",
pemeriksaan:"08/09/2026",
status:"🟡 Perhatian"
},

<div class="pin red" onclick="show('3')">
3
</div>
pokok:"5,900 unit",
keluasan:"32 Ha",
umur:"7 Tahun",
pemeriksaan:"08/09/2026",
status:"🔴 Pemeriksaan"
}

};


document.getElementById("detail").innerHTML =

`
<h2>🌴 Maklumat Block ${block}</h2>

🌴 Pokok: ${data[block].pokok}<br>

📏 Keluasan: ${data[block].keluasan}<br>

🌱 Umur Pokok: ${data[block].umur}<br>

📅 Pemeriksaan: ${data[block].pemeriksaan}<br>

Status: ${data[block].status}

`;

}

</script>


</body>
</html>
